name: Capture production audit evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.head_ref == 'fix/next-15-5-21-security' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture npm audit JSON without changing the gate
        run: npm audit --omit=dev --json > production-audit.json || true

      - name: Upload immutable audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: production-audit-${{ github.run_id }}
          path: production-audit.json
          if-no-files-found: error
          retention-days: 2
