name: Generate patched security lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.head_ref == 'fix/production-advisory-gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          ref: fix/production-advisory-gate
          fetch-depth: 0
          persist-credentials: true

      - name: Stop after generated commit
        id: guard
        run: |
          if git log -1 --format=%B | grep -q '\[security-lock-generated\]'; then
            echo 'generate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'generate=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.guard.outputs.generate == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Generate patched manifest and lockfile with npm
        if: ${{ steps.guard.outputs.generate == 'true' }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact \
            next@15.5.21 \
            next-auth@5.0.0-beta.32 \
            sharp@0.35.3
          npm install --package-lock-only --save-dev --save-exact postcss@8.5.18
          npm pkg set 'overrides.fast-uri=3.1.4'
          npm pkg set 'overrides.postcss=8.5.18'
          npm pkg set 'overrides.protobufjs=7.6.5'
          npm pkg set 'overrides.sharp=$sharp'
          npm install --package-lock-only

      - name: Validate exact patched versions and scope
        if: ${{ steps.guard.outputs.generate == 'true' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json')
          const expected = [
            [p.dependencies?.next, '15.5.21', 'next'],
            [p.dependencies?.['next-auth'], '5.0.0-beta.32', 'next-auth'],
            [p.dependencies?.sharp, '0.35.3', 'sharp'],
            [p.devDependencies?.postcss, '8.5.18', 'postcss'],
            [p.overrides?.['fast-uri'], '3.1.4', 'fast-uri override'],
            [p.overrides?.postcss, '8.5.18', 'postcss override'],
            [p.overrides?.protobufjs, '7.6.5', 'protobufjs override'],
            [p.overrides?.sharp, '$sharp', 'sharp override'],
          ]
          for (const [actual, wanted, name] of expected) {
            if (actual !== wanted) throw new Error(`${name}: expected ${wanted}, received ${actual}`)
          }
          NODE
          changed="$(git diff --name-only)"
          test "$changed" = $'package-lock.json\npackage.json' || test "$changed" = $'package.json\npackage-lock.json'

      - name: Commit npm-generated security update
        if: ${{ steps.guard.outputs.generate == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Patch production dependency advisories [security-lock-generated]'
          git push origin HEAD:fix/production-advisory-gate
