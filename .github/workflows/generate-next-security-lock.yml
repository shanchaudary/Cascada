name: Generate Next.js security lockfile

on:
  push:
    branches: [fix/next-15-5-21-security]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout update branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          ref: fix/next-15-5-21-security
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate only the declared dependency and lockfile
        run: npm install --package-lock-only --save-exact next@15.5.21

      - name: Reject unrelated manifest changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = $'package-lock.json\npackage.json' || test "$changed" = $'package.json\npackage-lock.json'
          node -e 'const p=require("./package.json"); if(p.dependencies.next!=="15.5.21") process.exit(1)'

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Next.js to 15.5.21 [lock-generated]"
          git push origin HEAD:fix/next-15-5-21-security
