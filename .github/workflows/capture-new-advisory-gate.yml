name: Capture new advisory gate evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.head_ref == 'fix/production-advisory-gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 22

      - name: Capture gate output and exact exit code
        run: |
          set +e
          node scripts/security/audit-production.mjs > advisory-gate-output.txt 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > advisory-gate-exit-code.txt
          test "$code" -ge 0 -a "$code" -le 2

      - name: Upload immutable gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: advisory-gate-${{ github.run_id }}
          path: |
            advisory-gate-output.txt
            advisory-gate-exit-code.txt
          if-no-files-found: error
          retention-days: 2
